# Cloudflare Worker for Choice Auto Tap licensing.
# Secrets (never committed; set with `wrangler secret put` or the deploy workflow):
#   LICENSE_SIGNING_KEY  ECDSA P-256 private key, PKCS#8, base64
#   LICENSE_CODE_KEY     32+ random bytes, base64 (hashes/encrypts activation codes)
#   ADMIN_TOKEN          owner password for the admin page / admin API
name = "choice-auto-tap-license"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "choice-auto-tap-licenses"
# Replaced by the deploy workflow / `wrangler d1 create` output. A placeholder works for local dev.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
